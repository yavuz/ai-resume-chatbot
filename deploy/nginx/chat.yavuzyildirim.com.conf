# /etc/nginx/sites-available/chat.yavuzyildirim.com
#
# Etkinleştir:
#   sudo ln -s /etc/nginx/sites-available/chat.yavuzyildirim.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (443 bloğunu certbot bu dosyaya kendisi ekler):
#   sudo certbot --nginx -d chat.yavuzyildirim.com

# Uygulamadaki limitlerin önündeki ilk katman. (Bu dosya http {} içine include edilir.)
limit_req_zone $binary_remote_addr zone=chatbot_api:10m rate=10r/m;

upstream chatbot_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.yavuzyildirim.com;

    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Akan (SSE) cevaplar: buffering kapalı olmalı, yoksa cevap tek parça gelir.
    location = /api/chat {
        limit_req zone=chatbot_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://chatbot_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Append değil overwrite: istemci sahte X-Forwarded-For gönderip limiti aşamasın.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://chatbot_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
